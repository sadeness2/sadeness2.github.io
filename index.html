<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shoganai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style id="app-css">
:root{--ink:#f4f4f6;--mute:#a9a9b3;--panel:rgba(8,8,12,.5);--line:rgba(255,255,255,.16);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{font-family:"Sora",system-ui,sans-serif;color:var(--ink);background:#030305;overflow-x:hidden}
#bg,#bgv{position:fixed;inset:0;width:100%;height:100%;z-index:0;object-fit:cover;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.15) brightness(.85);transform:scale(1.05)}
#bgv{display:none}
body.color #bg,body.color #bgv{filter:none}
.side{position:fixed;top:22%;width:min(24vw,300px);height:48vh;z-index:1;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.2);opacity:.85;display:none;animation:float 7s ease-in-out infinite}
.side.on{display:block}
#sl{left:0;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
#sr{right:0;animation-delay:-3s;-webkit-mask-image:linear-gradient(270deg,#000 55%,transparent);mask-image:linear-gradient(270deg,#000 55%,transparent)}
@keyframes float{50%{transform:translateY(-14px)}}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.8))}
#fx{position:fixed;inset:0;z-index:3;pointer-events:none}
main{position:relative;z-index:4;min-height:100%;display:flex;align-items:center;justify-content:center;padding:48px 16px 110px}
.card{width:min(460px,100%);text-align:center;transition:transform .15s;will-change:transform}
.avatar{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);overflow:hidden;cursor:pointer;padding:0;background:#111;display:block;position:relative;box-shadow:0 0 30px rgba(255,255,255,.25),0 12px 40px rgba(0,0,0,.8)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{position:absolute;inset:auto 0 0;background:rgba(0,0,0,.65);font:600 11px "Sora",sans-serif;padding:6px 0;opacity:0;transition:opacity .2s}
.avatar:hover span,.avatar:focus-visible span{opacity:1}
h1{font-size:2.8rem;font-weight:800;margin:0;text-shadow:0 0 22px rgba(255,255,255,.55),0 3px 18px #000}
.tag{margin:6px 0 12px;font-weight:600;min-height:1.5em;text-wrap:balance;padding:0 8px;text-shadow:0 2px 12px #000}
.tag .a::after{content:"|";display:inline-block;width:0;overflow:visible;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.loc{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:.9rem;margin-bottom:16px}
.icons{display:flex;gap:18px;justify-content:center;margin-bottom:26px}
.icons a{color:#fff;display:block;transition:transform .2s,filter .2s;filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.icons a:hover{transform:scale(1.2) translateY(-2px);filter:drop-shadow(0 0 14px #fff)}
.icons svg{width:34px;height:34px;display:block}
.icons #riotBtn svg{width:28px;height:28px;margin:3px}
.acc{display:grid;gap:10px;text-align:left}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.item>button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font:600 1rem "Sora",sans-serif;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chev{width:9px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);transition:transform .25s}
.item.open .chev{transform:rotate(-135deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.item.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.in{padding:0 18px 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(0,0,0,.3)}
.stat dt{color:var(--mute);font-size:.75rem;margin:0}
.stat dd{margin:2px 0 0;font-size:1.5rem;font-weight:800}
.stat.test{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 12px;border-style:dashed}
.stat.test dd{font-size:1rem;margin:0}
.in p{margin:0;color:var(--mute);line-height:1.55;font-size:.92rem}
.views{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:.85rem;font-weight:600;text-shadow:0 1px 8px #000}
.snd{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:6;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.snd svg{width:22px;height:22px;overflow:visible}
.snd{transition:background .25s,transform .15s}.snd:hover{background:rgba(255,255,255,.12)}.snd:active{transform:scale(.92)}
.snd .wv{transform-origin:13px 12px;transition:opacity .3s,transform .3s}
.snd .mu{opacity:0;stroke-dasharray:9;stroke-dashoffset:9;transition:stroke-dashoffset .3s .05s,opacity .2s}
.snd.off .wv{opacity:0;transform:scale(.6)}
.snd.off .mu{opacity:1;stroke-dashoffset:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;border:0;background:#fff;color:#111;font:600 .85rem "Sora",sans-serif;padding:11px 18px;border-radius:999px;cursor:pointer}
.panel{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:7;width:min(310px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:rgba(10,10,14,.95);border:1px solid var(--line);border-radius:14px;padding:14px;display:none}
.panel.show{display:block}
.panel h2{font-size:.8rem;margin:14px 0 8px;color:var(--mute);font-weight:600}
.panel h2:first-child{margin-top:0}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.up{display:block;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:9px;cursor:pointer;font-size:.82rem;margin-top:8px}
.panel input[type=file]{display:none}
.panel input[type=text]{width:100%;margin-bottom:6px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:400 .85rem "Sora",sans-serif}
.chk{display:flex;gap:8px;align-items:center;font-size:.82rem;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .78rem Sora,sans-serif;cursor:pointer}
.chip.on{background:#fff;color:#111}
input[type=range]{accent-color:#fff;flex:1}
.chk input[type=color]{width:36px;height:26px;border:0;padding:0;background:none}
.avwrap{position:relative;width:132px;height:132px;margin:0 auto 14px}
.avwrap .avatar{margin:0}
.avwrap::before,.avwrap::after{content:"";position:absolute;border-radius:50%;pointer-events:none;opacity:0}
.avwrap[data-halo=glow]::before{opacity:1;inset:-4px;box-shadow:0 0 34px 8px var(--hc);animation:hpulse 3s ease-in-out infinite}
.avwrap[data-halo=ring]::before{opacity:1;inset:-9px;background:conic-gradient(from 0deg,var(--hc),transparent 45%,var(--hc));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));animation:hspin 4s linear infinite}
.avwrap[data-halo=ripple]::before,.avwrap[data-halo=ripple]::after{inset:0;border:2px solid var(--hc);animation:hrip 3s ease-out infinite}
.avwrap[data-halo=ripple]::after{animation-delay:-1.5s}
.avwrap[data-halo=neon]::before{opacity:1;inset:-7px;border:2px solid var(--hc);box-shadow:0 0 14px var(--hc),inset 0 0 14px var(--hc);animation:hflick 4s steps(1) infinite}
.avwrap[data-halo=orbit]::before{opacity:1;inset:-14px;background:radial-gradient(circle at 50% 0,var(--hc) 0 4px,transparent 5px);filter:drop-shadow(0 0 6px var(--hc));animation:hspin 5s linear infinite}
@keyframes hpulse{50%{opacity:.45;transform:scale(1.05)}}
@keyframes hspin{to{transform:rotate(360deg)}}
@keyframes hrip{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes hflick{0%,92%,96%{opacity:1}94%,98%{opacity:.55}}
body::before{content:"";position:fixed;inset:0;z-index:2;background:#000;opacity:var(--dm,0);pointer-events:none}
body.grain::after{content:"";position:fixed;inset:-50%;z-index:3;pointer-events:none;opacity:.14;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grn .9s steps(1) infinite}
@keyframes grn{0%{transform:translate(0,0)}25%{transform:translate(-4%,3%)}50%{transform:translate(3%,-4%)}75%{transform:translate(-3%,-2%)}}
#splash{position:fixed;inset:0;z-index:20;background:#030305;display:grid;place-items:center;cursor:pointer;transition:opacity .7s;font-weight:600;letter-spacing:.08em;color:var(--mute)}
#splash.off{opacity:0;pointer-events:none}
@media (max-width:760px){.side{display:none!important}h1{font-size:2.3rem}}
.rn{height:0;margin:0;overflow:hidden;opacity:0;font-weight:700;text-shadow:0 0 14px rgba(255,255,255,.5),0 2px 10px #000;transition:height .25s,opacity .25s,margin .25s}
.rn.show{height:1.6em;opacity:1;margin:-10px 0 22px}
body:not(.edit) .fab,body:not(.edit) .panel{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.save{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:#fff;color:#111;font:700 .9rem Sora,sans-serif;cursor:pointer}.st2{font-size:.78rem;color:var(--mute);margin:8px 0 0}
body:not(.edit) .avatar{cursor:default}body:not(.edit) .avatar span{display:none}
.vol{position:fixed;left:calc(max(14px,env(safe-area-inset-left)) + 52px);top:max(14px,env(safe-area-inset-top));z-index:6;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center}
.vol input{-webkit-appearance:none;appearance:none;flex:none;width:96px;height:20px;margin:0;background:transparent;cursor:pointer}
.vol input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p,30%),rgba(255,255,255,.22) var(--p,30%))}
.vol input::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.vol input::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0}
.vol input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.pcl{margin:0;display:grid;gap:8px}
.pcr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(0,0,0,.3)}
.pcr dt{flex:none;color:var(--mute);font-size:.75rem;margin:0}
.pcr dd{margin:0;font-size:.9rem;font-weight:600;text-align:right;overflow-wrap:anywhere}
.panel textarea{width:100%;min-height:130px;resize:vertical;margin-bottom:6px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:400 .8rem/1.5 "Sora",sans-serif}
.avatar img{pointer-events:none;-webkit-user-select:none;user-select:none}
.icons{align-items:center}
